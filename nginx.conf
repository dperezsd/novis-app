server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Endpoint de salud para pruebas de humo
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Assets con hash en el nombre: cache largo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta devuelve index.html
    location / {
        try_files $uri /index.html;
    }
}
